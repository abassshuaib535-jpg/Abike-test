<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ND Marketing Quiz: 100 Questions</title>
<style>
:root{--bg:#eef2f5;--ink:#12263a;--mute:#5b6b7a;--card:#fff;--line:#cdd7df;--acc:#0f6b66;--ok:#1b7f4b;--okbg:#e2f4ea;--no:#b3261e;--nobg:#fbe7e5}
@media(prefers-color-scheme:dark){:root{--bg:#0e1a26;--ink:#e6edf3;--mute:#94a3b2;--card:#162534;--line:#2a3c4d;--acc:#4fc3b9;--ok:#5fd18f;--okbg:#14382a;--no:#ff8a80;--nobg:#3d1d1b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:28px 18px 60px}
h1{font:700 2rem/1.15 Georgia,"Times New Roman",serif;margin:8px 0 10px}
h2{font:700 1.35rem/1.35 Georgia,serif;margin:14px 0 18px}
.lead{color:var(--mute);margin:0 0 22px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px}
.chip.on{border-color:var(--acc);background:var(--acc);color:#fff}
@media(prefers-color-scheme:dark){.chip.on{color:#06231f}}
.chip small{opacity:.75;margin-left:4px}
.len{display:block;margin-bottom:22px;color:var(--mute)}
select{font:inherit;margin-left:8px;padding:6px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.go,.next{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:13px 26px;font-weight:600}
@media(prefers-color-scheme:dark){.go,.next{color:#06231f}}
.ghost{background:none;border:1.5px solid var(--line);border-radius:10px;padding:12px 22px;margin-left:10px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--acc);transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:.9rem;margin:14px 0 0}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:13px 16px;margin-bottom:10px}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.no{border-color:var(--no);background:var(--nobg)}
.fb{min-height:28px;font-weight:600;margin:6px 0 14px}
.score{font:700 4rem/1 Georgia,serif;color:var(--acc);margin:10px 0 4px}
.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.miss{background:var(--card);border-left:4px solid var(--no);border-radius:6px;padding:10px 14px;margin:10px 0}
.miss b{display:block;color:var(--ok);font-weight:600;margin-top:2px}
.miss small{color:var(--mute)}
h3{margin:28px 0 6px}
.in{display:block;width:100%;margin:6px 0 0;font:inherit;padding:11px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
</style>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4.4.1/dist/email.min.js"></script>
</head>
<body>
<main id="app"></main>
<script>
// Format: [topic, question, "correct answer|wrong|wrong|wrong"]  (options are shuffled when the quiz runs)
const T={R:"Marketing research",P:"7Ps of marketing",M:"Business mathematics",E:"Economics",A:"Accounting",S:"Business studies"};
const Q=[
// Marketing research
["R","After the problem is defined, the next step in the research process is:","Developing the research design|Analysing the data|Presenting the report|Conducting fieldwork"],
["R","Exploratory research is mainly used to:","Clarify vague problems and generate hypotheses|Prove cause and effect|Measure market share precisely|Audit financial records"],
["R","A study measuring the proportion of households buying a brand, by income group, is:","Descriptive research|Exploratory research|Causal research|Projective research"],
["R","Cause-and-effect relationships are best established through:","Controlled experiments|Desk research|Focus groups|Casual observation"],
["R","In stratified sampling, the population is:","Divided into homogeneous subgroups, then sampled from each|Sampled by choosing every kth unit|Sampled by convenience|Divided into clusters, all of which are surveyed"],
["R","Systematic sampling involves:","Selecting every kth element after a random start|Dividing the population into strata|Choosing the easiest-to-reach respondents|Choosing by quota"],
["R","A marketing information system differs from a single research project because it is:","A continuous system for gathering and distributing information|A one-off study|Limited to surveys|Used only by governments"],
["R","Reliability of a measure refers to:","Consistency of results on repeated measurement|Whether it measures what it claims to|The sample size used|The cost of the study"],
["R","Validity of a measure refers to:","Whether it measures what it is intended to measure|Consistency over time|The response rate|The sampling frame"],
["R","Non-response bias arises when:","Those who refuse differ systematically from those who respond|The sample is too large|Questions are closed-ended|Data are secondary"],
["R","A semantic differential scale uses:","Bipolar adjectives at each end of the scale|Agree/disagree statements|Rankings of brands only|Open-ended answers"],
["R","Word association and sentence completion are examples of:","Projective techniques|Experimental designs|Probability sampling|Secondary sources"],
["R","A consumer panel is:","A fixed sample that reports purchases repeatedly over time|A single-use survey|A government census|A one-off focus group"],
["R","A research hypothesis is:","A testable statement about the relationship between variables|A final conclusion|A sampling frame|A budget estimate"],
["R","Other things equal, increasing sample size will:","Reduce sampling error|Increase sampling error|Remove all bias|Make the data secondary"],
// 7Ps
["P","Sales growth slows and competitors intensify price and promotion in the:","Maturity stage|Introduction stage|Growth stage|Development stage"],
["P","Under the Ansoff matrix, selling new products in new markets is:","Diversification|Market penetration|Market development|Product development"],
["P","The width of a product mix is the number of:","Different product lines|Variants within a line|Brands in the market|Distributors used"],
["P","The depth of a product mix is the number of:","Variants offered within each product line|Product lines|Competitors|Countries served"],
["P","Price skimming is most suitable when:","The product is novel and demand is relatively inelastic|Demand is highly elastic|Competitors are many and identical|The goal is maximum market share at once"],
["P","If demand is price elastic, a price cut will:","Increase total revenue|Decrease total revenue|Leave revenue unchanged|Reduce quantity demanded"],
["P","A manufacturer selling directly to consumers uses a:","Zero-level channel|One-level channel|Two-level channel|Three-level channel"],
["P","Intensive distribution means:","Stocking the product in as many outlets as possible|Using one outlet per area|Selling only online|Using a few selected outlets"],
["P","Exclusive distribution is most typical of:","Luxury or high-status products|Everyday convenience goods|Newspapers|Bottled water"],
["P","A push strategy directs promotion mainly at:","Intermediaries in the channel|End consumers through mass media|Competitors|Shareholders"],
["P","A pull strategy relies mainly on:","Consumer advertising that creates demand|Trade discounts to retailers|Personal selling to wholesalers|Price cuts to staff"],
["P","In the AIDA model, the letters stand for:","Attention, Interest, Desire, Action|Awareness, Image, Demand, Acquisition|Advertising, Information, Distribution, Analysis|Attitude, Intention, Decision, Adoption"],
["P","Inseparability of services means:","Production and consumption occur at the same time|Services can be stored|Services are identical each time|Services can be owned"],
["P","Perishability of services means they:","Cannot be stored for later sale|Are tangible|Can be returned|Last forever"],
["P","A service blueprint is a tool for analysing which P?","Process|Price|Place|Product"],
["P","Treating employees as internal customers is called:","Internal marketing|Direct marketing|Relationship pricing|Viral marketing"],
["P","Which promotion tool mainly builds long-term goodwill rather than immediate sales?","Public relations|Sales promotion|Personal selling|Direct mail coupons"],
// Business mathematics
["M","Cost ₦8,000 and selling price ₦10,000. The margin on selling price is:","20%|25%|80%|2%"],
["M","Cost ₦8,000 and selling price ₦10,000. The markup on cost is:","25%|20%|80%|125%"],
["M","₦50,000 at 10% compound interest for 2 years amounts to:","₦60,500|₦60,000|₦55,000|₦61,000"],
["M","Simple interest on ₦120,000 at 5% for 4 years is:","₦24,000|₦6,000|₦30,000|₦20,000"],
["M","Fixed cost ₦600,000, price ₦500, variable cost ₦200. Break-even units:","2,000|1,200|3,000|857"],
["M","Sales are 2,500 units and break-even is 2,000 units. The margin of safety is:","20% of sales|25% of sales|500%|80% of sales"],
["M","Scores of 60 (weight 2) and 80 (weight 3) give a weighted mean of:","72|70|68|75"],
["M","Standard deviation is:","The square root of the variance|The square of the variance|The mean of the range|The median minus the mode"],
["M","Reducing-balance depreciation at 20% on ₦100,000: year 2 charge is:","₦16,000|₦20,000|₦18,000|₦14,000"],
["M","List price ₦20,000 less 10% trade discount, then 5% cash discount. Amount paid:","₦17,100|₦17,000|₦18,000|₦16,000"],
["M","Sales rise from ₦400,000 to ₦460,000. The percentage increase is:","15%|60%|13%|10%"],
["M","Solve x + y = 10 and x - y = 2. Then x =","6|4|8|5"],
["M","A price rises from 250 to 300. With base 100, the price index is:","120|83|150|20"],
["M","The probability of two heads when two fair coins are tossed:","1/4|1/2|1/3|3/4"],
["M","The roots of x² - 5x + 6 = 0 are:","2 and 3|1 and 6|-2 and -3|-1 and -6"],
["M","The present value of ₦121,000 due in 2 years at 10% compound interest is:","₦100,000|₦110,000|₦99,000|₦105,000"],
["M","A correlation coefficient of -0.9 indicates:","A strong negative relationship|A weak positive relationship|No relationship|A perfect positive relationship"],
// Economics
["E","Price rises 10% and quantity demanded falls 20%. The price elasticity (absolute) is:","2|0.5|10|30"],
["E","A negative income elasticity of demand indicates:","An inferior good|A normal good|A luxury good|A substitute"],
["E","A positive cross elasticity of demand between two goods shows they are:","Substitutes|Complements|Unrelated|Inferior"],
["E","The law of diminishing marginal returns says that adding more of a variable input to a fixed input will eventually:","Give smaller increases in output|Reduce fixed costs|Increase output at a faster rate|Eliminate costs"],
["E","Economies of scale are:","Falls in long-run average cost as output increases|Rises in average cost with output|Falls in demand|Increases in fixed prices"],
["E","A perfectly competitive firm maximises profit where:","Marginal cost equals marginal revenue|Average cost equals price only|Total revenue is zero|Marginal cost is zero"],
["E","Price discrimination requires that the seller can:","Separate markets and prevent resale|Ignore demand|Set a price of zero|Control all inputs"],
["E","An oligopoly is characterised by:","A few interdependent firms|One firm only|Thousands of small firms|Free government supply"],
["E","Monopolistic competition has:","Many firms with differentiated products|One seller|Identical products|Fixed prices by law"],
["E","If the marginal propensity to consume is 0.8, the multiplier is:","5|0.8|1.25|8"],
["E","Cost-push inflation is caused by:","Rising costs of production|Excess aggregate demand|A fall in the money supply|Falling wages"],
["E","Demand-pull inflation is caused by:","Aggregate demand exceeding supply|Higher import tariffs only|Falling productivity only|Lower interest rates only"],
["E","The current account of the balance of payments records:","Trade in goods and services|Long-term capital flows|Foreign reserves only|Government debt"],
["E","Raising the central bank policy rate usually:","Reduces borrowing and aggregate demand|Increases lending|Lowers interest rates|Raises the money supply"],
["E","A country has a comparative advantage when it produces a good at:","A lower opportunity cost|A higher absolute cost|A higher price|A lower quality"],
["E","A pure public good is:","Non-rival and non-excludable|Rival and excludable|Always provided by firms|Always free to produce"],
["E","A negative externality is:","A cost imposed on third parties that is not reflected in price|A benefit to buyers|A tax on sellers|A subsidy"],
// Accounting
["A","The prudence concept requires that:","Profits are not overstated and losses are anticipated|All gains are recognised early|Assets are valued at selling price|Costs are ignored"],
["A","The going concern concept assumes the business will:","Continue in operation for the foreseeable future|Close next year|Be sold soon|Make losses"],
["A","The consistency concept requires:","The same accounting methods from period to period|Changing methods every year|Ignoring estimates|Valuing stock at selling price"],
["A","An unpresented cheque is one that:","Has been issued and recorded but not yet cleared by the bank|Has bounced|Has been cashed|Was never written"],
["A","A suspense account is used to:","Temporarily hold a trial balance difference|Record sales|Store cash|Show capital"],
["A","An error of omission means a transaction was:","Left out of the books entirely, so the trial balance still agrees|Posted to the wrong side|Recorded twice|Posted with wrong amounts on both sides"],
["A","A provision for doubtful debts is:","Charged to the income statement and deducted from receivables|Added to receivables|Shown as a liability only|Ignored"],
["A","Prepaid expenses are shown in the balance sheet as:","A current asset|A current liability|Capital|Revenue"],
["A","Accrued expenses are shown in the balance sheet as:","A current liability|A current asset|A fixed asset|Equity"],
["A","A machine costs ₦500,000, scrap value ₦50,000, life 5 years. Annual straight-line depreciation:","₦90,000|₦100,000|₦110,000|₦450,000"],
["A","The current ratio is:","Current assets divided by current liabilities|Current liabilities divided by current assets|Assets divided by capital|Net profit divided by sales"],
["A","The acid-test (quick) ratio is:","(Current assets - inventory) divided by current liabilities|Current assets divided by inventory|Inventory divided by sales|Profit divided by assets"],
["A","Gross profit margin is:","Gross profit divided by sales, times 100|Net profit divided by assets|Sales divided by purchases|Expenses divided by sales"],
["A","Inventory turnover is:","Cost of goods sold divided by average inventory|Sales divided by receivables|Purchases divided by payables|Profit divided by inventory"],
["A","Goodwill arises when a business is bought for:","More than the fair value of its net identifiable assets|Less than its net assets|Exactly book value|Cash only"],
["A","If a partnership agreement is silent, profits are shared:","Equally|In proportion to capital|In proportion to age|Only to the senior partner"],
["A","Prime cost is:","Direct materials + direct labour + direct expenses|Direct materials + factory overheads|Total cost + profit|Sales - purchases"],
// Business studies
["S","Taylor scientific management emphasised:","Time and motion study to raise efficiency|Employee social needs|Democratic leadership|Corporate social responsibility"],
["S","The Hawthorne studies by Mayo showed that:","Social factors and attention affect productivity|Only pay motivates workers|Machines matter most|Supervision harms output"],
["S","In Herzberg theory, motivators include:","Achievement and recognition|Salary only|Working conditions only|Company policy"],
["S","McGregor Theory X assumes workers:","Dislike work and need close control|Seek responsibility|Are self-motivated|Want autonomy"],
["S","Fayol unity of command means each employee:","Receives orders from one superior only|Has many bosses|Chooses their manager|Has no manager"],
["S","In line and staff organisation, staff authority is:","Advisory|Command over line managers|Absent|Financial only"],
["S","Porter generic strategies are:","Cost leadership, differentiation and focus|Price, product and place|Stars, cows and dogs|Strengths and weaknesses"],
["S","Which is one of Porter Five Forces?","Threat of new entrants|Political stability|Brand loyalty|Employee morale"],
["S","In PESTLE analysis, the letter L stands for:","Legal|Labour|Leadership|Liquidity"],
["S","In the Boston matrix, a Star has:","High market growth and high market share|Low growth and low share|Low growth and high share|High growth and low share"],
["S","In the Boston matrix, a Cash Cow has:","Low market growth and high market share|High growth and high share|High growth and low share|Low growth and low share"],
["S","A company memorandum of association states its:","Objects and relationship with the outside world|Internal rules of management|Annual profit|Staff list"],
["S","A private limited company:","Restricts share transfer and cannot offer shares to the public|Sells shares on the stock exchange|Has unlimited liability|Has no shareholders"],
["S","An essential element of a valid contract is:","Consideration|A written document always|A witness always|Government approval"],
["S","Corporate social responsibility means:","Acting in society interest beyond profit alone|Maximising short-term profit only|Avoiding all taxes|Ignoring employees"],
["S","Contingency theory of leadership holds that:","The best style depends on the situation|One style is always best|Leaders are born|Authority is irrelevant"],
["S","Decentralisation is:","Delegating decision-making authority to lower levels|Centralising all decisions|Closing branches|Merging departments"]
];

const $=s=>document.querySelector(s),app=$("#app");
const shuf=a=>{a=[...a];for(let n=a.length;n>1;){const j=Math.floor(Math.random()*n--);[a[n],a[j]]=[a[j],a[n]]}return a};
// EmailJS settings
const EJ={service:"service_rdao21k",key:"zDl8bcT-u-iOljWI8",template:"template_qynaar8"};
if(window.emailjs)emailjs.init({publicKey:EJ.key});
let who="",mail="",sent=false,sel=new Set(Object.keys(T)),count=0,pool=[],i=0,score=0,miss=[],st={},done=false;

function home(){
  app.innerHTML=`<h1>ND Marketing Quiz</h1>
  <p class="lead">${Q.length} questions across six subjects at National Diploma level. Choose what to practise, then start.</p>
  <label class="len">Your name<input class="in" id="nm" autocomplete="name" placeholder="Full name"></label>
  <label class="len">Your email (optional)<input class="in" id="em" type="email" placeholder="you@example.com"></label>
  <div class="chips">${Object.keys(T).map(k=>`<button class="chip ${sel.has(k)?"on":""}" data-k="${k}" aria-pressed="${sel.has(k)}">${T[k]}<small>${Q.filter(x=>x[0]==k).length}</small></button>`).join("")}</div>
  <label class="len">Number of questions<select id="n">${[10,25,50,0].map(n=>`<option value="${n}" ${n==count?"selected":""}>${n||"All selected"}</option>`).join("")}</select></label>
  <p class="fb" id="err" style="color:var(--no)"></p><button class="go" id="go">Start quiz</button>`;
  $("#nm").value=who;$("#em").value=mail;
  $("#nm").oninput=e=>who=e.target.value;$("#em").oninput=e=>mail=e.target.value;
  app.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(sel.has(k)){if(sel.size>1)sel.delete(k)}else sel.add(k);home()});
  $("#n").onchange=e=>count=+e.target.value;
  $("#go").onclick=start;
}
function start(){
  who=who.trim();if(!who){$("#err").textContent="Enter your name to start.";$("#nm").focus();return}
  sent=false;
  pool=shuf(Q.filter(x=>sel.has(x[0])).map(([t,q,o])=>{const p=o.split("|");return{t,q,a:p[0],o:shuf(p)}}));
  if(count)pool=pool.slice(0,count);
  i=0;score=0;miss=[];st={};ask();
}
function ask(){
  const x=pool[i];done=false;
  app.innerHTML=`<div class="bar"><span style="width:${i/pool.length*100}%"></span></div>
  <p class="meta"><span>${T[x.t]}</span><span>Question ${i+1} of ${pool.length}</span></p>
  <h2>${x.q}</h2>
  ${x.o.map((o,n)=>`<button class="opt" data-n="${n}">${o}</button>`).join("")}
  <p class="fb" aria-live="polite"></p><div id="nx"></div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.n));
}
function pick(n){
  if(done)return;done=true;
  const x=pool[i],ok=x.o[n]==x.a;
  st[x.t]=st[x.t]||[0,0];st[x.t][1]++;
  if(ok){score++;st[x.t][0]++}else miss.push(x);
  app.querySelectorAll(".opt").forEach((b,k)=>{b.disabled=true;if(x.o[k]==x.a)b.classList.add("ok");else if(k==n)b.classList.add("no")});
  $(".fb").textContent=ok?"Correct.":"Not quite. The right answer is highlighted.";
  $("#nx").innerHTML=`<button class="next" id="nb">${i+1<pool.length?"Next question":"See results"}</button>`;
  $("#nb").onclick=next;$("#nb").focus();
}
const note=t=>{const e=$("#note");if(e)e.textContent=t};
function send(){
  if(sent)return;sent=true;
  const p=Math.round(score/pool.length*100);
  const by=Object.keys(st).map(k=>`${T[k]}: ${st[k][0]}/${st[k][1]}`).join(" | ");
  const ms=miss.map((x,n)=>`${n+1}) ${x.q} Answer: ${x.a}`).join(" || ")||"None";
  if(!window.emailjs){note("Result could not be sent. Check your connection.");return}
  emailjs.send(EJ.service,EJ.template,{name:who,email:mail||"no-email@example.com",title:`ND Marketing quiz result for ${who}: ${p}%`,time:new Date().toLocaleString(),message:`Score: ${score} of ${pool.length} (${p}%). By subject: ${by}. Missed: ${ms}`})
    .then(()=>note("Your result has been sent."),()=>note("Result could not be sent. Check your connection."));
}
function next(){i++;i<pool.length?ask():results()}
function results(){
  const p=Math.round(score/pool.length*100);
  app.innerHTML=`<h1>Your results</h1><div class="score">${p}%</div>
  <p class="lead">${score} of ${pool.length} correct. ${p>=80?"Excellent work.":p>=50?"Good effort. Review the missed ones below.":"Keep practising. Retry the missed questions."}</p>
  <h3>By subject</h3>${Object.keys(st).map(k=>`<div class="row"><span>${T[k]}</span><span>${st[k][0]} / ${st[k][1]}</span></div>`).join("")}
  ${miss.length?`<h3>Missed questions</h3>${miss.map(x=>`<div class="miss"><small>${T[x.t]}</small><br>${x.q}<b>${x.a}</b></div>`).join("")}`:""}
  <p class="fb" id="note">Sending your result…</p>
  <p style="margin-top:12px"><button class="go" id="again">New quiz</button>${miss.length?`<button class="ghost" id="rm">Retry missed</button>`:""}</p>`;
  $("#again").onclick=home;send();
  if(miss.length)$("#rm").onclick=()=>{pool=shuf(miss);i=0;score=0;miss=[];st={};ask()};
}
document.addEventListener("keydown",e=>{
  const b=app.querySelectorAll(".opt");
  if(b.length&&!done&&e.key>="1"&&e.key<=String(b.length))pick(+e.key-1);
});
home();
</script>
</body>
</html>
